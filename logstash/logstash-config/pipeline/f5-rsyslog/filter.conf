filter {

  # ==========================================================================
  # Syslog header
  # ==========================================================================
  #
  # Parses the syslog header of BIG-IP lines written by rsyslog and maps it to ECS.
  #
  #   <133>2026-11-05T02:08:32+01:00 bigip1 notice tmm3[19781]: 01010221:5: Pool /Common/lpt_pool now has available members
  #    |   |                         |      |      |    |       |          |
  #    |   |                         |      |      |    |       |          message
  #    |   |                         |      |      |    |       event.code (F5 message ID, see /etc/alertd/*_maps.h)
  #    |   |                         |      |      |    process.pid
  #    |   |                         |      |      process.name
  #    |   |                         |      log.level
  #    |   |                         host.hostname
  #    |   @timestamp
  #    log.syslog.priority
  #
  # The digit after the message ID is a severity code. It's not kept since it
  # usually repeats log.level, and when it doesn't (throttling notices reuse the
  # ID and code of the message being throttled) it describes another message.
  #
  # Lines from some daemons have no message ID, e.g. iRule `log` statements:
  #   <134>2026-11-05T02:09:55+01:00 bigip1 info tmm1[19781]: Rule /Common/lpt_irule <HTTP_REQUEST>: lpt request /hello from 192.0.2.163
  #
  # The original line is kept in event.original by the input (ECS mode).

  # F5_SLOT:         VIPRION blades prefix the hostname with the slot, e.g. slot1/bigip1
  # F5_PROCESS_NAME: anything up to the optional [pid], e.g. tmm3, sshd(pam_audit), mprov:2480:
  grok {
    id => "f5-syslog-header"
    pattern_definitions => {
      "F5_SLOT"         => "slot(?<[f5][slot]>[0-9]+)/"
      "F5_PROCESS_NAME" => "[^\[\s]+?"
      "F5_MESSAGE_ID"   => "[0-9a-f]{8}"
    }
    match => {
      "message" => "^<%{NONNEGINT:[log][syslog][priority]:int}>%{TIMESTAMP_ISO8601:[@metadata][timestamp]} (?:%{F5_SLOT})?%{HOSTNAME:[host][hostname]} %{WORD:[log][level]} %{F5_PROCESS_NAME:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: (?:%{F5_MESSAGE_ID:[event][code]}:[0-9]: )?%{GREEDYDATA:message}$"
    }
    # Filebeat's add_host_metadata sets host.hostname to the Beat's host
    overwrite      => ["message", "[host][hostname]"]
    tag_on_failure => ["_f5_header_parse_failure"]
  }

  if "_f5_header_parse_failure" not in [tags] {

    # rsyslog writes the time zone offset, so no time zone setting is needed
    date {
      id    => "f5-syslog-timestamp"
      match => ["[@metadata][timestamp]", "ISO8601"]
    }

    # Sets log.syslog.facility.* and log.syslog.severity.* from the priority
    syslog_pri {
      id                    => "f5-syslog-priority"
      syslog_pri_field_name => "[log][syslog][priority]"
    }

    mutate {
      id        => "f5-syslog-observer"
      add_field => {
        "[observer][vendor]"  => "F5"
        "[observer][product]" => "BIG-IP"
      }
    }

    # Same rule the BIG-IP uses to split local0 into /var/log/audit and
    # /var/log/ltm (filter f_audit in /etc/syslog-ng/syslog-ng.conf).
    # Lines from other facilities get no dataset (not parsed further yet).
    if [log][syslog][facility][name] == "local0" {
      if [message] =~ /AUDIT/ {
        mutate { id => "f5-dataset-audit" add_field => { "[event][dataset]" => "f5.audit" } }
      } else {
        mutate { id => "f5-dataset-ltm"   add_field => { "[event][dataset]" => "f5.ltm" } }
      }
    }
  }

  # ==========================================================================
  # Log throttling
  # ==========================================================================
  #
  # Log throttling notices.
  #
  # BIG-IP daemons throttle messages that repeat too often and log a notice
  # when they start and stop doing so. These notices reuse the message ID
  # (event.code) of the message being throttled, for example:
  #
  #   01010028:3: No members available for pool /Common/lpt_pool
  #   01010028:3: Resuming log processing at this invocation; held 9 messages.
  #
  # They are handled here, before the per-message parsers, and get an
  # event.action so that later files leave them alone.

  if [message] =~ /^(Resuming log processing at this invocation|Re-enabling general logging); held [0-9]+ messages\.$/ {
    grok {
      id             => "f5-log-throttling-ended"
      match          => { "message" => "; held %{INT:[f5][log_throttling][held_messages]:int} messages\.$" }
      add_field      => { "[event][action]" => "log-throttling-ended" }
      tag_on_failure => ["_f5_parse_failure"]
    }
  }

  if [message] =~ /^(Per-invocation log rate exceeded; throttling\.|Cumulative log rate exceeded!  Throttling all non-debug logs\.)$/ {
    mutate {
      id        => "f5-log-throttling-started"
      add_field => { "[event][action]" => "log-throttling-started" }
    }
  }

  # ==========================================================================
  # ltm (event.dataset f5.ltm)
  # ==========================================================================
  #
  # Message parsers for /var/log/ltm (event.dataset f5.ltm).
  #
  # Each block handles one message, selected by its F5 message ID (event.code).
  # The comment above each block has the format string from
  # /etc/alertd/*_maps.h and a real example of the message part of the line.
  #
  # Conventions:
  #   * event.action is only set when the message was parsed, so an event
  #     without event.action is a message nobody has written a parser for.
  #   * A message that has a parser but doesn't match it gets the tag
  #     _f5_parse_failure. Look at event.code to find the block.
  #   * Lines that an earlier file already handled (they have event.action)
  #     are skipped, see the log throttling section.

  if [event][dataset] == "f5.ltm" and ![event][action] {

    # ------------------------------------------------------------------ Pools

    # 01070638 POOL_MEMBER_MON_STATUS     "Pool %s member %s:%u monitor status %s."
    # 01070727 POOL_MEMBER_MON_STATUS_UP  "Pool %s member %s:%u monitor status up."
    # 01070639 POOL_MEMBER_SESS_STATUS    "Pool %s member %s:%u session status %s."
    #
    # mcpd appends the monitor result and the previous status to monitor
    # status messages:
    #   Pool /Common/lpt_pool member /Common/192.0.2.1:80 monitor status down. [ /Common/lpt_http: down; last error: /Common/lpt_http: No successful responses received before deadline. @2026/11/05 02:08:59.  ]  [ was up for 0hr:0min:27sec ]
    #   Pool /Common/lpt_pool member /Common/192.0.2.1:80 session status forced disabled.
    if [event][code] in ["01070638", "01070727", "01070639"] {
      grok {
        id    => "f5-ltm-pool-member-status"
        match => {
          "message" => "^Pool %{NOTSPACE:[f5][pool][name]} member %{NOTSPACE:[f5][pool][member][name]}:%{POSINT:[f5][pool][member][port]:int} %{WORD:[f5][status][type]} status %{DATA:[f5][status][current]}\.(?: \[ %{DATA:[f5][monitor][result]}\s+\])?(?:  \[ was %{DATA:[f5][status][previous]} for %{DATA:[f5][status][previous_duration]} \])?$"
        }
        add_field      => { "[event][action]" => "pool-member-status-change" }
        tag_on_failure => ["_f5_parse_failure"]
      }

      # The monitor result is "<monitor>: <status>" with an optional
      # "; last error: ...". Best effort: pools with several monitors may
      # use other formats, so a mismatch here is not tagged.
      if [f5][monitor][result] {
        grok {
          id    => "f5-ltm-pool-member-monitor-result"
          match => {
            "[f5][monitor][result]" => "^%{NOTSPACE:[f5][monitor][name]}: %{WORD:[f5][monitor][status]}(?:; last error: %{GREEDYDATA:[error][message]})?$"
          }
          tag_on_failure => []
        }
      }
    }

    # 01010028 LAST_PMBR_DOWN  "No members available for pool %s"
    #   No members available for pool /Common/always_down_02-pool
    if [event][code] == "01010028" {
      grok {
        id             => "f5-ltm-pool-no-members-available"
        match          => { "message" => "^No members available for pool %{NOTSPACE:[f5][pool][name]}$" }
        add_field      => { "[event][action]" => "pool-no-members-available" }
        tag_on_failure => ["_f5_parse_failure"]
      }
    }

    # 01010221 PMBR_BACK_UP  "Pool %s now has available members"
    #   Pool /Common/lpt_pool now has available members
    if [event][code] == "01010221" {
      grok {
        id             => "f5-ltm-pool-members-available"
        match          => { "message" => "^Pool %{NOTSPACE:[f5][pool][name]} now has available members$" }
        add_field      => { "[event][action]" => "pool-members-available" }
        tag_on_failure => ["_f5_parse_failure"]
      }
    }

    # --------------------------------------------------------------- Monitors

    # 01070807 MON_INST_PM_ENABLED  "Monitor %s instance %s:%u has been %s."
    #   Monitor /Common/lpt_icmp instance 192.0.2.1:0 has been disabled.
    if [event][code] == "01070807" {
      grok {
        id    => "f5-ltm-monitor-instance-status"
        match => {
          "message" => "^Monitor %{NOTSPACE:[f5][monitor][name]} instance %{NOTSPACE:[f5][monitor][instance][address]}:%{INT:[f5][monitor][instance][port]:int} has been %{WORD:[f5][status][current]}\.$"
        }
        add_field      => { "[event][action]" => "monitor-instance-status-change" }
        tag_on_failure => ["_f5_parse_failure"]
      }
    }

    # ------------------------------------------------- Virtual servers/addresses

    # 01071681 VIRTUAL_AVAIL      "SNMP_TRAP: Virtual %s has become available"
    # 01071682 VIRTUAL_UNAVAIL    "SNMP_TRAP: Virtual %s has become unavailable"
    # 01071ba9 VIRTUAL_UNCHECKED  "Virtual %s has become unchecked"
    #   SNMP_TRAP: Virtual /Common/lpt_vs has become unavailable
    if [event][code] in ["01071681", "01071682", "01071ba9"] {
      grok {
        id             => "f5-ltm-virtual-server-status"
        match          => { "message" => "^(?:SNMP_TRAP: )?Virtual %{NOTSPACE:[f5][virtual_server][name]} has become %{WORD:[f5][status][current]}$" }
        add_field      => { "[event][action]" => "virtual-server-status-change" }
        tag_on_failure => ["_f5_parse_failure"]
      }
    }

    # 01070921 VIP_ENABLE_DISABLE  "Virtual Server '%s' on partition '%s' %s by user '%s'."
    #   Virtual Server '/Common/lpt_vs' on partition 'Common' disabled by user 'root'.
    if [event][code] == "01070921" {
      grok {
        id    => "f5-ltm-virtual-server-enabled"
        match => {
          "message" => "^Virtual Server '%{DATA:[f5][virtual_server][name]}' on partition '%{DATA:[f5][partition]}' %{WORD:[f5][status][current]} by user '%{DATA:[user][name]}'\.$"
        }
        add_field      => { "[event][action]" => "virtual-server-enabled-change" }
        tag_on_failure => ["_f5_parse_failure"]
      }
    }

    # 010719e7 VIRTUAL_ADDRESS_GSTATUS_CHANGE     "Virtual Address %s general status changed from %s to %s."
    # 010719e8 VIRTUAL_ADDRESS_MON_STATUS_CHANGE  "Virtual Address %s monitor status changed from %s to %s."
    #   Virtual Address /Common/192.0.2.240 general status changed from GREEN to RED.
    if [event][code] in ["010719e7", "010719e8"] {
      grok {
        id    => "f5-ltm-virtual-address-status"
        match => {
          "message" => "^Virtual Address %{NOTSPACE:[f5][virtual_address][name]} %{WORD:[f5][status][type]} status changed from %{WORD:[f5][status][previous]} to %{WORD:[f5][status][current]}\.$"
        }
        add_field      => { "[event][action]" => "virtual-address-status-change" }
        tag_on_failure => ["_f5_parse_failure"]
      }
    }

    # ----------------------------------------------------------------- iRules

    # iRule `log` statements have no message ID:
    #   Rule /Common/lpt_irule <HTTP_REQUEST>: lpt request /hello from 192.0.2.163
    if ![event][code] and [message] =~ /^Rule / {
      grok {
        id    => "f5-ltm-irule-log"
        match => {
          "message" => "^Rule %{NOTSPACE:[f5][irule][name]} <%{WORD:[f5][irule][event]}>: %{GREEDYDATA:[f5][irule][log_message]}$"
        }
        add_field      => { "[event][action]" => "irule-log" }
        tag_on_failure => ["_f5_parse_failure"]
      }
    }

    # 01220001 RULES_TCLERROR  "TCL error: %s"
    #   TCL error: /Common/lpt_irule <HTTP_REQUEST> - divide by zero     while executing "expr {1 / 0}"
    if [event][code] == "01220001" {
      grok {
        id    => "f5-ltm-irule-tcl-error"
        match => {
          "message" => "^TCL error: %{NOTSPACE:[f5][irule][name]} <%{WORD:[f5][irule][event]}> - %{GREEDYDATA:[error][message]}$"
        }
        add_field      => { "[event][action]" => "irule-tcl-error" }
        tag_on_failure => ["_f5_parse_failure"]
      }
    }

    # ---------------------------------------------------------- Authentication

    # 01070827 AUTHZ_NO_USER_ACCESS  "User login disallowed: %s"
    #   User login disallowed: User (lptnouser) is not an administrator, does not have a UID of zero, and has not been assigned a role on a partition.
    if [event][code] == "01070827" {
      grok {
        id    => "f5-ltm-user-login-disallowed"
        match => {
          "message" => "^User login disallowed: User \(%{DATA:[user][name]}\) %{GREEDYDATA:[event][reason]}$"
        }
        add_field => {
          "[event][action]"   => "user-login-disallowed"
          "[event][category]" => "authentication"
          "[event][outcome]"  => "failure"
        }
        tag_on_failure => ["_f5_parse_failure"]
      }
    }
  }

  # ==========================================================================
  # audit (event.dataset f5.audit)
  # ==========================================================================
  #
  # Message parsers for /var/log/audit (event.dataset f5.audit).
  #
  # Same conventions as the ltm section. Audit lines without a parser (e.g. the
  # tmm "AUDIT - The DB variable ..." messages) keep only the header fields.

  if [event][dataset] == "f5.audit" and ![event][action] {

    # ------------------------------------------------- Configuration changes

    # 01070417 MCPD_AUDIT  "AUDIT - user %s - transaction #%u-%u - object %u - %s"
    #
    # mcpd logs every object that is created, modified or deleted. The
    # object data is cut at the first newline (e.g. iRule definitions),
    # and then [Status=...] is missing.
    #   AUDIT - client tmsh, tmsh-pid-15937, user root - transaction #366677-2 - object 0 - obj_delete { pool { pool_name "/Common/lpt_pool" } } [Status=Command OK]
    #   AUDIT - client tmui, user admin - transaction #1914467-2 - object 0 - modify { software_desired { software_desired_volume "HD1.2" software_desired_active 1 } } [Status=Command OK]
    if [event][code] == "01070417" and [message] =~ /^AUDIT - client / {
      grok {
        id    => "f5-audit-mcpd-transaction"
        match => {
          "message" => "^AUDIT - client %{DATA:[f5][audit][client]}(?:, %{NOTSPACE}-pid-%{POSINT:[f5][audit][client_pid]:int})?, user %{DATA:[user][name]} - transaction #%{NOTSPACE:[f5][audit][transaction]} - object %{INT} - %{WORD:[f5][audit][operation]} %{DATA:[f5][audit][object]}(?: \[Status=%{DATA:[f5][audit][status]}\])?$"
        }
        add_field => {
          "[event][action]"   => "configuration-change"
          "[event][category]" => "configuration"
        }
        tag_on_failure => ["_f5_parse_failure"]
      }

      # The object data starts with the object type, then the field mcpd
      # uses as the object's key. object_name is that key's value when it
      # is a quoted string, which is the case for nearly all objects:
      #   { virtual_server { virtual_server_name "/Common/lpt_vs" ... } }          -> /Common/lpt_vs
      #   { pool_member { pool_member_pool_name "/Common/lpt_pool" ... } }         -> /Common/lpt_pool
      #   { virtual_server_profile { virtual_server_profile_vs_name "/Common/lpt_vs" ... } } -> /Common/lpt_vs
      #   { ips_inspection_sig { ips_inspection_sig_insp_tag "/Common/..." ... } } -> /Common/...
      # Objects keyed on a number (e.g. rp_current_status_slot_id 0) only
      # get object_type.
      grok {
        id    => "f5-audit-mcpd-object"
        match => {
          "[f5][audit][object]" => [
            "^\{ %{WORD:[f5][audit][object_type]} \{ %{WORD} \"%{DATA:[f5][audit][object_name]}\"",
            "^\{ %{WORD:[f5][audit][object_type]} "
          ]
        }
        tag_on_failure => []
      }

      if [f5][audit][operation] =~ /^create/ {
        mutate { id => "f5-audit-type-creation" add_field => { "[event][type]" => "creation" } }
      } else if [f5][audit][operation] =~ /^modify/ {
        mutate { id => "f5-audit-type-change"   add_field => { "[event][type]" => "change" } }
      } else if [f5][audit][operation] =~ /delete/ {
        mutate { id => "f5-audit-type-deletion" add_field => { "[event][type]" => "deletion" } }
      }
    }

    # ------------------------------------------------------- tmsh commands

    # 01420002 TMSH_AUDIT  "AUDIT - %s"
    #   AUDIT - pid=15714 user=root folder=/Common module=(tmos)# status=[Command OK] cmd_data=modify ltm virtual lpt_vs disabled
    #   AUDIT - pid=16854 user=root folder=/Common module=(tmos)# status=[Syntax Error: a volume must be specified] cmd_data=install /sys software image ...
    if [event][code] == "01420002" {
      grok {
        id    => "f5-audit-tmsh-command"
        match => {
          "message" => "^AUDIT - pid=%{POSINT} user=%{DATA:[user][name]} folder=%{NOTSPACE:[f5][audit][folder]} module=\(%{DATA:[f5][audit][module]}\)# status=\[%{DATA:[f5][audit][status]}\] cmd_data=%{GREEDYDATA:[f5][audit][command]}$"
        }
        add_field      => { "[event][action]" => "tmsh-command" }
        tag_on_failure => ["_f5_parse_failure"]
      }
    }

    # ----------------------------------------------------- Logins (pam_audit)

    # 01070417 with "RAW: <service>(pam_audit)" from sshd, httpd and rest.
    # A session is logged twice: when it starts and, with end="...", when
    # it ends. Failed logins have their own format.
    #   AUDIT - user root - RAW: sshd(pam_audit): user=root(root) partition=[All] level=Administrator tty=ssh host=192.0.2.163 attempts=1 start="Tue Nov  3 07:34:30 2026".
    #   AUDIT - user root - RAW: sshd(pam_audit): user=root(root) partition=[All] level=Administrator tty=ssh host=192.0.2.163 attempts=1 start="Tue Nov  3 07:34:30 2026" end="Tue Nov  3 07:44:51 2026".
    #   AUDIT - user admin - RAW: httpd(pam_audit): User=admin tty=(unknown) host=192.0.2.163 failed to login after 1 attempts (start="Tue Nov  3 07:36:44 2026" end="Tue Nov  3 07:36:46 2026").
    if [event][code] == "01070417" and [message] =~ /^AUDIT - user .* - RAW: / {
      grok {
        id    => "f5-audit-login"
        match => {
          "message" => [
            "^AUDIT - user %{DATA:[user][name]} - RAW: %{WORD:[f5][audit][service]}\(%{DATA}\): user=%{DATA}\(%{DATA}\) partition=\[%{DATA:[f5][audit][partition]}\] level=%{DATA:[user][roles]} tty=%{NOTSPACE:[f5][audit][tty]} host=%{NOTSPACE:[source][address]}(?: attempts=%{INT:[f5][audit][login_attempts]:int})? start=\"%{DATA:[f5][audit][session][start]}\"(?: end=\"%{DATA:[f5][audit][session][end]}\")?\.$",
            "^AUDIT - user %{DATA:[user][name]} - RAW: %{WORD:[f5][audit][service]}\(%{DATA}\): User=%{DATA} tty=%{NOTSPACE:[f5][audit][tty]} host=%{NOTSPACE:[source][address]} (?<[@metadata][login_failed]>failed to login) after %{INT:[f5][audit][login_attempts]:int} attempts \(start=\"%{DATA:[f5][audit][session][start]}\" end=\"%{DATA:[f5][audit][session][end]}\"\)\.$"
          ]
        }
        add_field      => { "[event][category]" => "authentication" }
        tag_on_failure => ["_f5_parse_failure"]
      }

      if [@metadata][login_failed] {
        mutate {
          id        => "f5-audit-login-failed"
          add_field => { "[event][action]" => "login-failed" "[event][type]" => "start" "[event][outcome]" => "failure" }
        }
      } else if [f5][audit][session][end] {
        mutate {
          id        => "f5-audit-session-end"
          add_field => { "[event][action]" => "session-end" "[event][type]" => "end" "[event][outcome]" => "success" }
        }
      } else if [f5][audit][session][start] {
        mutate {
          id        => "f5-audit-session-start"
          add_field => { "[event][action]" => "session-start" "[event][type]" => "start" "[event][outcome]" => "success" }
        }
      }

      # host= is normally an IP address
      if [source][address] =~ /^[0-9a-fA-F.:]+$/ {
        mutate { id => "f5-audit-source-ip" copy => { "[source][address]" => "[source][ip]" } }
      }

      # Session times are BIG-IP local time, like the syslog timestamp
      date {
        id       => "f5-audit-session-start-time"
        match    => ["[f5][audit][session][start]", "EEE MMM  d HH:mm:ss yyyy", "EEE MMM dd HH:mm:ss yyyy"]
        timezone => "${F5_TIMEZONE:UTC}"
        target   => "[f5][audit][session][start]"
      }
      date {
        id       => "f5-audit-session-end-time"
        match    => ["[f5][audit][session][end]", "EEE MMM  d HH:mm:ss yyyy", "EEE MMM dd HH:mm:ss yyyy"]
        timezone => "${F5_TIMEZONE:UTC}"
        target   => "[f5][audit][session][end]"
      }
    }

    # ------------------------------------------------------ Command outcome

    # mcpd and tmsh both report "Command OK" on success
    if [f5][audit][status] == "Command OK" {
      mutate { id => "f5-audit-outcome-success" add_field => { "[event][outcome]" => "success" } }
    } else if [f5][audit][status] {
      mutate { id => "f5-audit-outcome-failure" add_field => { "[event][outcome]" => "failure" } }
    }
  }
}
