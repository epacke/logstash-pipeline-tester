# Log throttling notices.
#
# BIG-IP daemons throttle messages that repeat too often and log a notice
# when they start and stop doing so. These notices reuse the message ID
# (event.code) of the message being throttled, for example:
#
#   01010028:3: No members available for pool /Common/lpt_pool
#   01010028:3: Resuming log processing at this invocation; held 9 messages.
#
# They are handled here, before the per-message parsers, and get an
# event.action so that later files leave them alone.

filter {
  if [message] =~ /^(Resuming log processing at this invocation|Re-enabling general logging); held [0-9]+ messages\.$/ {
    grok {
      id             => "f5-log-throttling-ended"
      match          => { "message" => "; held %{INT:[f5][log_throttling][held_messages]:int} messages\.$" }
      add_field      => { "[event][action]" => "log-throttling-ended" }
      tag_on_failure => ["_f5_parse_failure"]
    }
  }

  if [message] =~ /^(Per-invocation log rate exceeded; throttling\.|Cumulative log rate exceeded!  Throttling all non-debug logs\.)$/ {
    mutate {
      id        => "f5-log-throttling-started"
      add_field => { "[event][action]" => "log-throttling-started" }
    }
  }
}
