# F5 BIG-IP remote syslog pipeline.
#
# The pipeline is split into files that Logstash concatenates in name order:
#
#   00-input.conf          listeners
#   10-syslog-header.conf  syslog header -> ECS, decides event.dataset
#   20-log-throttling.conf "held N messages" notices that any daemon can emit
#   30-ltm.conf            message parsers for event.dataset f5.ltm
#   40-audit.conf          message parsers for event.dataset f5.audit
#   99-output.conf         output

input {
  tcp {
    port => 5245
    id   => "f5-input-tcp"
  }
  udp {
    port => 5245
    id   => "f5-input-udp"
  }
}
