# Parses the syslog header that every BIG-IP line starts with and maps it to ECS.
#
#   <133>Nov  5 02:08:32 bigip1 notice tmm3[19781]: 01010221:5: Pool /Common/lpt_pool now has available members
#    |   |               |      |      |    |       |          |
#    |   |               |      |      |    |       |          message
#    |   |               |      |      |    |       event.code (F5 message ID, see /etc/alertd/*_maps.h)
#    |   |               |      |      |    process.pid
#    |   |               |      |      process.name
#    |   |               |      log.level
#    |   |               host.hostname
#    |   @timestamp
#    log.syslog.priority
#
# The digit after the message ID is a severity code. It's not kept since it
# usually repeats log.level, and when it doesn't (throttling notices reuse the
# ID and code of the message being throttled) it describes another message.
#
# Lines from some daemons have no message ID, e.g. iRule `log` statements:
#   <134>Nov  5 02:09:55 bigip1 info tmm1[19781]: Rule /Common/lpt_irule <HTTP_REQUEST>: lpt request /hello from 192.0.2.163
#
# The original line is kept in event.original by the input (ECS mode).
#
# Works with both the tcp/udp inputs and the syslog input. The syslog input
# parses the header itself before this runs: it removes <PRI> and the
# timestamp from message, misreads BIG-IP lines (no hostname for slot1/bigip1)
# and keeps the trailing newline. So the header is always parsed from
# event.original, and the fields the syslog input set are overwritten.

filter {
  if [event][original] {
    mutate {
      id    => "f5-syslog-raw-from-original"
      strip => ["[event][original]", "message"]
      copy  => { "[event][original]" => "[@metadata][raw]" }
    }
  } else {
    mutate {
      id   => "f5-syslog-raw-from-message"
      copy => { "message" => "[@metadata][raw]" }
    }
  }

  # F5_SLOT:         VIPRION blades prefix the hostname with the slot, e.g. slot1/bigip1
  # F5_PROCESS_NAME: anything up to the optional [pid], e.g. tmm3, sshd(pam_audit), mprov:2480:
  grok {
    id => "f5-syslog-header"
    pattern_definitions => {
      "F5_SLOT"         => "slot(?<[f5][slot]>[0-9]+)/"
      "F5_PROCESS_NAME" => "[^\[\s]+?"
      "F5_MESSAGE_ID"   => "[0-9a-f]{8}"
    }
    match => {
      "[@metadata][raw]" => "^<%{NONNEGINT:[log][syslog][priority]:int}>%{SYSLOGTIMESTAMP:[@metadata][timestamp]} (?:%{F5_SLOT})?%{HOSTNAME:[host][hostname]} %{WORD:[log][level]} %{F5_PROCESS_NAME:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: (?:%{F5_MESSAGE_ID:[event][code]}:[0-9]: )?%{GREEDYDATA:message}$"
    }
    overwrite      => ["message", "[log][syslog][priority]", "[host][hostname]", "[process][name]", "[process][pid]"]
    tag_on_failure => ["_f5_header_parse_failure"]
  }

  if "_f5_header_parse_failure" not in [tags] {

    # BIG-IP sends its local time without a time zone. Set F5_TIMEZONE in
    # the Logstash environment (e.g. Europe/Stockholm) if it isn't UTC.
    date {
      id       => "f5-syslog-timestamp"
      match    => ["[@metadata][timestamp]", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      timezone => "${F5_TIMEZONE:UTC}"
    }

    # Sets log.syslog.facility.* and log.syslog.severity.* from the priority
    syslog_pri {
      id                    => "f5-syslog-priority"
      syslog_pri_field_name => "[log][syslog][priority]"
    }

    mutate {
      id        => "f5-syslog-observer"
      add_field => {
        "[observer][vendor]"  => "F5"
        "[observer][product]" => "BIG-IP"
      }
    }

    # Same rule the BIG-IP uses to split local0 into /var/log/audit and
    # /var/log/ltm (filter f_audit in /etc/syslog-ng/syslog-ng.conf).
    # Lines from other facilities get no dataset (not parsed further yet).
    if [log][syslog][facility][name] == "local0" {
      if [message] =~ /AUDIT/ {
        mutate { id => "f5-dataset-audit" add_field => { "[event][dataset]" => "f5.audit" } }
      } else {
        mutate { id => "f5-dataset-ltm"   add_field => { "[event][dataset]" => "f5.ltm" } }
      }
    }
  }
}
